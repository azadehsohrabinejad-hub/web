<section class="card shadow-sm my-4" id="checklistExcelReport"><div class="card-header">گزارش چک‌لیست</div><div class="card-body"><form method="get" action="{{ url_for('main.checklist_export_excel') }}"><div class="row g-3"><div class="col-md-4"><label class="form-label w-100">انتخاب چک‌لیست<select class="form-select" name="kind" required>{% for choice in checklist_export_choices %}<option value="{{ choice.id }}">{{ choice.title }}</option>{% endfor %}</select></label></div><div class="col-md-3"><label class="form-label w-100">از تاریخ (شمسی)<input class="form-control" name="start_date" placeholder="۱۴۰۵/۰۷/۰۱"></label></div><div class="col-md-3"><label class="form-label w-100">تا تاریخ (شمسی)<input class="form-control" name="end_date" placeholder="۱۴۰۵/۰۷/۳۰"></label></div><div class="col-md-2 d-flex align-items-end pb-2"><button class="btn btn-success" type="submit">خروجی اکسل</button></div></div><small class="text-muted">بدون تاریخ، همه ثبت‌های قابل دسترسی صادر می‌شوند. فایل شامل خلاصه ثبت‌ها و جزئیات پاسخ‌هاست.</small></form></div></section>
