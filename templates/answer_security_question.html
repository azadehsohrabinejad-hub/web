<!-- templates/answer_security_question.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>پاسخ به سوال امنیتی</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-5.min.css') }}">
    <style>
        @font-face { font-family: Vazirmatn; src: url("{{ url_for('static', filename='fonts/Vazirmatn-Regular.woff2') }}") format('woff2'); font-display: swap; }
        body { font-family: Vazirmatn, Tahoma, sans-serif; background-color: #f8f9fa; min-height: 100vh; }
        .form-control { width: 100%; }
        .card-body { padding: 1.5rem; }
        .container { max-width: 600px; padding-top: 40px; padding-bottom: 40px; }
        .card { border-radius: 15px; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">بازیابی رمز عبور</h3>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="mb-3">
                        <label for="question_display">سوال امنیتی شما:</label>
                        <input type="text" id="question_display" class="form-control" value="{{ user.security_question }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="security_answer">پاسخ:</label>
                        <input type="text" name="security_answer" id="security_answer" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password">رمز عبور جدید:</label>
                        <input type="password" name="new_password" id="new_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password">تکرار رمز عبور جدید:</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">بازنشانی رمز عبور</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
