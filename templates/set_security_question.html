<!-- templates/set_security_question.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تنظیم سوال امنیتی</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-5.min.css') }}">
    <style>
        @font-face { font-family: Vazirmatn; src: url("{{ url_for('static', filename='fonts/Vazirmatn-Regular.woff2') }}") format('woff2'); font-display: swap; }
        body { font-family: Vazirmatn, Tahoma, sans-serif; background-color: #f8f9fa; min-height: 100vh; }
        .form-control, .form-select { width: 100%; }
        .card-body { padding: 1.5rem; }
        .container { max-width: 600px; padding-top: 40px; padding-bottom: 40px; }
        .card { border-radius: 15px; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">تنظیم سوال امنیتی</h3>
                <p class="text-center text-muted">لطفاً یک سوال امنیتی و پاسخ آن را برای بازیابی رمز عبور خود تنظیم کنید.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="mb-3">
                        <label for="security_question">سوال امنیتی را انتخاب کنید:</label>
                        <select name="security_question" id="security_question" class="form-select" required>
                            <option value="">-- انتخاب کنید --</option>
                            <option value="نام اولین دبستان شما چی بود؟">نام اولین دبستان شما چی بود؟</option>
                            <option value="نام حیوان خانگی مورد علاقه شما چیست؟">نام حیوان خانگی مورد علاقه شما چیست؟</option>
                            <option value="شهر محل تولد مادر شما کجاست؟">شهر محل تولد مادر شما کجاست؟</option>
                            <option value="نام کتاب مورد علاقه شما در کودکی چه بود؟">نام کتاب مورد علاقه شما در کودکی چه بود؟</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="security_answer">پاسخ شما:</label>
                        <input type="text" name="security_answer" id="security_answer" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">ذخیره سوال امنیتی</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
