{% if assigned_lists %}


<style>
.assigned-card {border-right:4px solid #d49b00;background:#fff8d9;}
.assigned-card.assigned-complete {border-right-color:#2b8a57;background:#fff;}
.assigned-card.assigned-urgent {border-right-color:#c93636;animation:assigned-pulse 2s ease-in-out infinite;}
@keyframes assigned-pulse {0%,100% {background:#ffe8e8;} 50% {background:#ffcaca;}}
@media (prefers-reduced-motion:reduce) {.assigned-card.assigned-urgent {animation:none;background:#ffcaca;}}
#assignedChecklistModal .modal-content {max-height:calc(100dvh - 2rem);}
#assignedChecklistForm {display:flex;flex-direction:column;min-height:0;flex:1 1 auto;}
#assignedChecklistForm .modal-body {overflow-y:auto;min-height:0;}
#assignedChecklistForm .modal-footer {flex-shrink:0;}
</style>
<div id="assignedChecklistCards" class="mt-3"></div>
<div class="modal fade" id="assignedChecklistModal" tabindex="-1" aria-labelledby="assignedChecklistTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg"><div class="modal-content">
<div class="modal-header"><h5 id="assignedChecklistTitle" class="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button></div>
<form id="assignedChecklistForm"><div class="modal-body"><div id="assignedChecklistItems"></div>
<div id="assignedChecklistTemperatureWrap" class="my-3"><label class="form-label" for="assignedChecklistTemperature">دمای سرور (°C)</label><input class="form-control" type="number" step="0.1" id="assignedChecklistTemperature"></div>
<label class="form-label" for="assignedChecklistNotes">توضیحات</label><textarea class="form-control" id="assignedChecklistNotes" rows="2" maxlength="1000"></textarea><div id="assignedChecklistError" class="alert alert-danger d-none mt-3" role="alert"></div></div>
<div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">انصراف</button><button id="assignedChecklistSave" type="submit" class="btn btn-success">ثبت نهایی</button></div></form>
</div></div></div>
<script type="application/json" id="assignedChecklistConfig">{{ {'token':assigned_token,'statusUrl':url_for('main.assigned_checklist_status'),'saveUrl':url_for('main.assigned_checklist_save',kind=0)} | tojson }}</script>
{% endif %}
