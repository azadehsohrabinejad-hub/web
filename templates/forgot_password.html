<!-- templates/forgot_password.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فراموشی رمز عبور</title>
    <link rel="stylesheet" href="https://cdn.rtlcss.com/bootstrap/v4.5.3/css/bootstrap.min.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8f9fa; }
        .container { max-width: 500px; margin-top: 50px; }
        .card { border-radius: 15px; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">بازیابی رمز عبور</h3>
                <p class="text-center text-muted">لطفاً نام کاربری خود را وارد کنید تا سوال امنیتی شما نمایش داده شود.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button></div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="form-group">
                        <label for="username">نام کاربری:</label>
                        <input type="text" name="username" id="username" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">مرحله بعد</button>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('main.login') }}">بازگشت به ورود</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
